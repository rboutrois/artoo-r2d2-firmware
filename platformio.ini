; Artoo R2D2 Controller Firmware
; Target: ESP32 D1 Mini (Wemos)
; Framework: Arduino

[env:esp32doit-devkit-v1]
platform = espressif32
board = wemos_d1_mini32
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbserial-*

; Partition scheme: OTA enabled (two app slots + SPIFFS) — 4MB flash
board_build.partitions  = default.csv
board_build.flash_size  = 4MB

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    ; Adafruit BusIO needs SPI.h from the ESP32 framework (not auto-found with espressif32 7.x)
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src

; Library Dependency Finder — chain+ evaluates preprocessor directives
; so built-in framework libs (SPI, Wire) are found automatically
lib_ldf_mode = chain+

; Dependencies
lib_deps =
    ; SBUS receiver (handles inverted UART, 100000 baud, 8E2)
    https://github.com/bolderflight/sbus.git#v8.1.4
    ; PCA9685 16-channel PWM/servo driver (I2C)
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    ; JSON for custom actions, sequences, config
    bblanchon/ArduinoJson @ ^7.0.0
    ; ESP32Servo for dome ESC PWM
    madhephaestus/ESP32Servo @ ^3.0.5

; SPIFFS filesystem upload — also triggered automatically after firmware upload
board_build.filesystem = spiffs
extra_scripts = scripts/upload_fs_after_fw.py
